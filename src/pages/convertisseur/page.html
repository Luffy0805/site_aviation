<section id="convertisseur">
  <h2>Convertisseur aéronautique</h2>
  <p class="sub">Vitesse, altitude, distance, pression, température, masse. Le Mach suit la vraie atmosphère standard.</p>
  <div class="conv">
    <div class="tabs" id="tabs"></div>
    <div class="row">
      <label>Valeur<input id="val" type="number" value="1" step="any" inputmode="decimal"></label>
      <label>Unité<select id="unit"></select></label>
      <label id="altw">Altitude pour le Mach (ft)<input id="alt" type="number" value="0" step="1000" inputmode="decimal"></label>
    </div>
    <div class="res" id="res"></div>
    <p class="note" id="note"></p>
  </div>
</section>
